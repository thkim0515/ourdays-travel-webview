<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>우리의 여행 모아보기</title>
<style>
  :root {
    color-scheme: light;
    --teal: #2F5D62;
    --teal-soft: #E9F1F0;
    --amber: #E8A33D;
    --amber-soft: #FDF3E3;
    --coral: #E2725B;
    --cream: #FBF7F0;
    --card: #FFFFFF;
    --ink: #2A2E2B;
    --sub: #7C8580;
    --line: #E9E4D8;
  }
  * { box-sizing: border-box; }
  html { scrollbar-width: thin; scrollbar-color: #D8D2C2 transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D8D2C2; border-radius: 999px; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 48px; }

  .hero {
    background: linear-gradient(135deg, var(--teal) 0%, #3E7A80 100%);
    padding: 32px 22px 26px;
    color: #fff;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 10px 24px -14px rgba(47,93,98,0.55);
  }
  .hero .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em;
    background: rgba(255,255,255,0.2);
    padding: 5px 11px; border-radius: 999px; margin-bottom: 12px;
  }
  .hero h1 { font-size: 22px; margin: 0 0 6px; line-height: 1.35; }
  .hero .sub { font-size: 13px; opacity: 0.92; line-height: 1.6; margin: 0; }

  .section-title {
    font-size: 13px; font-weight: 800; color: var(--sub);
    letter-spacing: 0.03em; margin: 26px 22px 10px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
  }

  .sort-row { margin: 0 22px 4px; display: flex; gap: 8px; }
  .sort-btn {
    flex: 1; text-align: center; font-size: 12px; font-weight: 700;
    padding: 9px 8px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--sub); cursor: pointer;
  }
  .sort-btn.active { background: var(--teal); color: #fff; border-color: var(--teal); }

  .trip-list { margin: 0 22px; display: flex; flex-direction: column; gap: 12px; }
  .trip-card {
    display: block; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px 16px; position: relative;
    box-shadow: 0 6px 16px -12px rgba(42,46,43,0.25);
  }
  .trip-card.past { opacity: 0.55; }
  .trip-card .top-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .trip-card .emoji {
    width: 36px; height: 36px; border-radius: 12px; background: var(--teal-soft);
    display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0;
  }
  .trip-card h3 { font-size: 15.5px; margin: 0; line-height: 1.35; }
  .trip-card .date {
    font-size: 10.5px; font-weight: 700; color: var(--sub);
    white-space: nowrap; margin-left: auto; padding-top: 2px;
  }
  .trip-card .subtitle { font-size: 12.5px; color: var(--sub); line-height: 1.55; margin: 0 0 4px 46px; }
  .trip-card .latest-chip {
    display: inline-block; font-size: 10.5px; font-weight: 800; color: var(--amber);
    background: var(--amber-soft); padding: 3px 9px; border-radius: 999px; margin: 2px 0 0 46px;
  }
  .trip-card .past-chip {
    display: inline-block; font-size: 10.5px; font-weight: 800; color: var(--sub);
    background: #EDEBE4; padding: 3px 9px; border-radius: 999px; margin: 2px 0 0 46px;
  }
  .empty-state {
    margin: 40px 22px; text-align: center; color: var(--sub); font-size: 13px; line-height: 1.7;
  }

  footer {
    margin: 30px 22px 0; font-size: 11px; color: #A8A190; line-height: 1.7;
    border-top: 1px solid var(--line); padding-top: 14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="badge">🧳 우리의 여행 모아보기</span>
    <h1>지금까지 함께한<br/>여행들</h1>
    <p class="sub">다가오는 여행이 맨 위에 와요. 카드를 누르면 그 여행의 상세 페이지로 이동해요.</p>
  </div>

  <div class="section-title">여행 목록</div>
  <div class="sort-row">
    <button type="button" class="sort-btn" id="sortAsc">날짜 오름차순</button>
    <button type="button" class="sort-btn" id="sortDesc">날짜 내림차순</button>
  </div>
  <div class="trip-list" id="tripList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">아직 등록된 여행이 없어요.</div>

  <footer>
    새 여행이 생길 때마다 이 목록에 자동으로 쌓여요. <br/>
    데이터 출처: <code>data/trips.json</code>
  </footer>

</div>

<script>
  function formatDate(dateStr) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    return parts[0] + "." + String(parts[1]).padStart(2, "0") + "." + String(parts[2]).padStart(2, "0") +
      " (" + days[d.getDay()] + ")";
  }

  // 오늘 날짜(자정 기준). "지나지 않은 여행"인지 판단하는 기준이 됨
  function todayStr() {
    var now = new Date();
    return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  }

  var TODAY = todayStr();
  var allTrips = [];
  var currentMode = "default"; // "default" | "asc" | "desc"

  // 기본 정렬: 지나지 않은 여행은 날짜가 가까운 순(오름차순)으로 위에, 지난 여행은 그 아래에 최신순으로 배치
  function sortDefault(trips) {
    var upcoming = trips.filter(function (t) { return t.date >= TODAY; })
      .sort(function (a, b) { return a.date.localeCompare(b.date); });
    var past = trips.filter(function (t) { return t.date < TODAY; })
      .sort(function (a, b) { return b.date.localeCompare(a.date); });
    return upcoming.concat(past);
  }

  function sortAsc(trips) {
    return trips.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
  }

  function sortDesc(trips) {
    return trips.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
  }

  function render() {
    var listEl = document.getElementById("tripList");
    var sorted;
    if (currentMode === "asc") sorted = sortAsc(allTrips);
    else if (currentMode === "desc") sorted = sortDesc(allTrips);
    else sorted = sortDefault(allTrips);

    var firstUpcomingIdx = -1;
    for (var k = 0; k < sorted.length; k++) {
      if (sorted[k].date >= TODAY) { firstUpcomingIdx = k; break; }
    }

    var html = "";
    sorted.forEach(function (trip, i) {
      var isPast = trip.date < TODAY;
      var chip = "";
      if (currentMode === "default" && i === firstUpcomingIdx) {
        chip = '<span class="latest-chip">가장 가까운 여행</span>';
      } else if (isPast) {
        chip = '<span class="past-chip">지난 여행</span>';
      }
      html += '<a class="trip-card' + (isPast ? ' past' : '') + '" href="' + trip.url + '">' +
        '<div class="top-row">' +
          '<div class="emoji">' + (trip.emoji || "🗺️") + '</div>' +
          '<h3>' + trip.title + '</h3>' +
          '<div class="date">' + formatDate(trip.date) + '</div>' +
        '</div>' +
        (trip.subtitle ? '<p class="subtitle">' + trip.subtitle + '</p>' : '') +
        chip +
      '</a>';
    });
    listEl.innerHTML = html;

    document.getElementById("sortAsc").classList.toggle("active", currentMode === "asc");
    document.getElementById("sortDesc").classList.toggle("active", currentMode === "desc");
  }

  document.getElementById("sortAsc").addEventListener("click", function () {
    currentMode = currentMode === "asc" ? "default" : "asc";
    render();
  });
  document.getElementById("sortDesc").addEventListener("click", function () {
    currentMode = currentMode === "desc" ? "default" : "desc";
    render();
  });

  fetch("data/trips.json?t=" + Date.now())
    .then(function (res) { return res.json(); })
    .then(function (trips) {
      var emptyEl = document.getElementById("emptyState");
      if (!trips || !trips.length) {
        emptyEl.style.display = "block";
        return;
      }
      allTrips = trips;
      render();
    })
    .catch(function () {
      document.getElementById("emptyState").textContent = "여행 목록을 불러오지 못했어요.";
      document.getElementById("emptyState").style.display = "block";
    });
</script>
</body>
</html>
