<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>대전·논산 데이트 드라이브 코스</title>
<style>
  :root {
    color-scheme: light;
    --teal: #2F5D62;
    --teal-soft: #E9F1F0;
    --amber: #E8A33D;
    --amber-soft: #FDF3E3;
    --coral: #E2725B;
    --coral-soft: #FBEAE6;
    --cream: #FBF7F0;
    --card: #FFFFFF;
    --ink: #2A2E2B;
    --sub: #7C8580;
    --line: #E9E4D8;
  }
  * { box-sizing: border-box; }
  html { scrollbar-width: thin; scrollbar-color: #D8D2C2 transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D8D2C2; border-radius: 999px; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 48px; }

  /* 히어로 */
  .hero {
    background: linear-gradient(135deg, var(--teal) 0%, #3E7A80 100%);
    padding: 32px 22px 26px;
    color: #fff;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 10px 24px -14px rgba(47,93,98,0.55);
  }
  .hero .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em;
    background: rgba(255,255,255,0.2);
    padding: 5px 11px; border-radius: 999px; margin-bottom: 12px;
  }
  .hero h1 { font-size: 22px; margin: 0 0 6px; line-height: 1.35; }
  .hero .sub { font-size: 13px; opacity: 0.92; line-height: 1.6; margin: 0 0 16px; }
  .sunset-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 14px; padding: 10px 14px; font-size: 12.5px; font-weight: 700;
  }
  .sunset-badge .emoji { font-size: 16px; }

  .section-title {
    font-size: 13px; font-weight: 800; color: var(--sub);
    letter-spacing: 0.03em; margin: 26px 22px 10px; text-transform: uppercase;
  }

  /* 타임라인 */
  .timeline { margin: 8px 22px 0; position: relative; }
  .stop { position: relative; padding-left: 30px; padding-bottom: 4px; }
  .stop::before {
    content: ""; position: absolute; left: 9px; top: 26px; bottom: -4px;
    width: 2px; background: var(--line);
  }
  .stop:last-child::before { display: none; }
  .stop .num {
    position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%;
    background: var(--teal); color: #fff; font-size: 10.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .stop.optional .num { background: var(--sub); }
  .stop-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 16px 16px;
    box-shadow: 0 6px 16px -12px rgba(42,46,43,0.25);
  }
  .stop.optional .stop-card { opacity: 0.62; }
  .stop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .stop-head h3 { font-size: 15.5px; margin: 0; }
  .stop-head .time-chip {
    font-size: 11px; font-weight: 800; color: var(--teal); background: var(--teal-soft);
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag {
    font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    background: var(--amber-soft); color: var(--amber);
  }
  .tag.optional-tag { background: #EDEBE4; color: var(--sub); }
  .addr { font-size: 12px; color: var(--sub); margin: 0 0 4px; line-height: 1.5; }
  .hours { font-size: 12px; color: var(--sub); margin: 0 0 10px; line-height: 1.5; }
  .desc { font-size: 12.5px; color: var(--ink); line-height: 1.6; margin: 0 0 8px; }
  .note {
    font-size: 11.5px; color: var(--coral); background: var(--coral-soft);
    border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.55;
  }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    flex: 1 1 auto; min-width: 84px; text-align: center;
    font-size: 12px; font-weight: 700; padding: 10px 10px; border-radius: 12px;
    border: 1px solid var(--line); color: var(--teal); background: var(--teal-soft);
  }
  .btn.tel { color: var(--coral); background: var(--coral-soft); }
  .connector {
    display: flex; align-items: center; gap: 6px; margin: 6px 0 10px 30px;
    padding: 10px 14px; border-radius: 12px;
    font-size: 15px; font-weight: 800; line-height: 1.4;
    color: #fff; background: var(--teal);
  }

  /* 소이벤트(동선 계산용) */
  .day-title {
    margin: 22px 0 10px; font-size: 12.5px; font-weight: 800; color: var(--teal);
    background: var(--teal-soft); border-radius: 999px; padding: 6px 14px; display: inline-block;
  }
  .mini { position: relative; padding-left: 30px; padding-bottom: 2px; }
  .mini::before {
    content: ""; position: absolute; left: 9px; top: 14px; bottom: -2px;
    width: 2px; background: var(--line);
  }
  .mini:last-child::before { display: none; }
  .mini .dot {
    position: absolute; left: 5px; top: 4px; width: 10px; height: 10px; border-radius: 50%;
    background: #fff; border: 2px solid var(--amber);
  }
  .mini-body {
    display: flex; align-items: baseline; gap: 8px; padding: 2px 0 8px;
    font-size: 14.5px; line-height: 1.55;
  }
  .mini-time {
    font-size: 13px; font-weight: 800; color: #8A5E1F; background: var(--amber-soft);
    padding: 2px 9px; border-radius: 999px; white-space: nowrap;
  }
  .mini-text { color: var(--ink); font-weight: 700; }
  .mini-text small { display: block; color: #4A524D; font-size: 13px; margin-top: 2px; }

  /* 전체 경로 지도 */
  .map-wrap {
    margin: 0 22px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
    background: #EFEAE0;
  }
  #routeMap { width: 100%; height: 260px; }
  .leaflet-pin {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--teal); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .leaflet-pin span { transform: rotate(45deg); color: #fff; font-size: 11px; font-weight: 800; }
  .leaflet-pin.optional-pin { background: var(--sub); }

  /* 체크리스트 */
  .check-list {
    margin: 0 22px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 6px 16px;
  }
  .check-item {
    display: flex; align-items: center; gap: 10px; padding: 12px 0;
    border-bottom: 1px solid var(--line); font-size: 13.5px; cursor: pointer;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item input { width: 18px; height: 18px; accent-color: var(--teal); flex-shrink: 0; }
  .check-item.checked span { color: var(--sub); text-decoration: line-through; }

  /* 참고사항 */
  .tip-list { margin: 0 22px; display: flex; flex-direction: column; gap: 8px; }
  .tip {
    background: var(--amber-soft); border-radius: 14px; padding: 12px 14px;
    font-size: 12.5px; color: #8A5E1F; line-height: 1.6;
  }

  footer {
    margin: 30px 22px 0; font-size: 11px; color: #A8A190; line-height: 1.7;
    border-top: 1px solid var(--line); padding-top: 14px;
  }

  /* 네이버 지도 */
  .map-wrap .naver-map { width: 100%; height: 260px; }
  .map-fallback {
    display: flex; align-items: center; justify-content: center; height: 260px;
    padding: 20px; text-align: center; color: var(--sub); font-size: 12px; line-height: 1.7;
  }
  .nv-pin {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, var(--teal), #3E7A80);
    color: #fff; font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    cursor: pointer;
  }
</style>
<!-- 네이버 지도 JS SDK (Client ID만 사용, 공개되어도 안전 — NCP 콘솔의 도메인 등록으로 보호) -->
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=imimukiww3"></script>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="badge">🚗 당일치기 드라이브 데이트</span>
    <h1>대전 → 논산<br/>한 방향 드라이브 코스</h1>
    <p class="sub">대전역 렌터카 픽업부터 강경구락부까지, 동쪽에서 서쪽으로만 쭉 이어지는 하루 코스예요. 되돌아가는 동선 없이 순서대로 따라가면 돼요.</p>
    <div class="sunset-badge"><span class="emoji">🗺️</span> 7곳 · 08:20 ~ 15:20 · 약 52km(직선)</div>
  </div>

  <div class="section-title">타임라인</div>
  <div class="timeline" id="timeline"></div>

  <div class="section-title">전체 경로 지도</div>
  <div class="map-wrap"><div id="routeMap" class="naver-map" role="img" aria-label="대전-논산 드라이브 전체 경로 지도"></div></div>
  <div style="margin:12px 22px 0;"><a class="btn" id="fullRouteLink" href="#" rel="noopener" onclick="return openFullRoute(event);" style="display:block;">🗺️ 전체 경로 네이버 지도에서 보기</a></div>

  <footer>
    영업시간·운영 요일은 방문 전 다시 한 번 확인해주세요.
  </footer>

</div>

<script>
  var STOPS = [
    {
      name: "대전역 (렌터카 픽업)",
      time: "08:20",
      lat: 36.3325, lng: 127.4344,
      desc: "렌터카를 픽업하고 드라이브 코스를 시작하는 곳이에요.",
      img: "assets/daejeon-station.jpg",
      warn: null
    },
    {
      name: "카페벌곡",
      time: "09:20",
      lat: 36.1953, lng: 127.2651,
      desc: "계곡 뷰가 예쁜 카페예요. 투명카약 체험도 할 수 있어요.",
      img: "assets/cafe-beolgok.jpg",
      warn: null
    },
    {
      name: "온빛자연휴양림",
      time: "10:10",
      lat: 36.2030, lng: 127.2520,
      desc: "캐나다풍 목조주택이 모여있어 포토존이 많아요.",
      img: "assets/onbit-forest.jpg",
      warn: null
    },
    {
      name: "반야사",
      time: "11:30",
      lat: 36.1111, lng: 127.1735,
      desc: "절벽 위에 자리한 사찰이라 전망이 정말 좋아요.",
      img: "assets/banyasa.jpg",
      warn: null
    },
    {
      name: "선샤인스튜디오",
      time: "12:40",
      lat: 36.1028, lng: 127.1051,
      desc: "드라마 '미스터 션샤인' 촬영지예요. 개화기 의상 대여도 가능해요.",
      img: "assets/sunshine-studio.jpg",
      warn: "⚠️ 매주 수요일 정기휴무 · 운영시간 10:00~18:00 (방문 전 요일 꼭 확인!)"
    },
    {
      name: "미내다리",
      time: "14:40",
      lat: 36.1528, lng: 127.0311,
      desc: "논산을 대표하는 옛 다리로, 사진 명소로 유명해요.",
      img: "assets/minae-bridge.jpg",
      warn: null
    },
    {
      name: "강경구락부",
      time: "15:20",
      lat: 36.1622, lng: 127.0152,
      desc: "근대 건축물을 개조한 카페 겸 레스토랑이에요. 하루를 마무리하기 좋은 곳.",
      img: "assets/ganggyeong-club.jpg",
      warn: null
    }
  ];

  // 네이버 지도 프록시 게이트웨이 (Client Secret은 서버에만 있고, 이 엔드포인트만 호출)
  var GATEWAY = "https://naver-map-gateway.vercel.app/api/naver-map";
  var NMAP_APPNAME = "com.couple.ourdays"; // OurDays 앱 Android 패키지 ID

  // 장소 하나를 네이버 지도로 열기 (앱이 있으면 nmap:// 딥링크, 없으면 지도 검색으로 폴백)
  function openInNaverMap(name, lat, lng) {
    var deepLink = "nmap://place?lat=" + lat + "&lng=" + lng +
      "&name=" + encodeURIComponent(name) + "&appname=" + NMAP_APPNAME;
    var fallbackUrl = "https://map.naver.com/p/search/" + encodeURIComponent(name);
    var fellBack = false;
    var timer = setTimeout(function () {
      if (document.hidden) return; // 앱으로 전환됐으면 폴백하지 않음
      fellBack = true;
      window.open(fallbackUrl, "_blank", "noopener");
    }, 900);
    document.addEventListener("visibilitychange", function onHide() {
      if (document.hidden) {
        clearTimeout(timer);
        document.removeEventListener("visibilitychange", onHide);
      }
    });
    window.location.href = deepLink;
  }

  // 전체 경로: 출발지 + 경유지(최대 5곳) + 도착지 (nmap 스킴 제한)
  function buildFullRouteDeepLink(stops) {
    var start = stops[0], end = stops[stops.length - 1];
    var mids = stops.slice(1, -1).slice(0, 5); // v1~v5까지만 지원
    var url = "nmap://route/car?slat=" + start.lat + "&slng=" + start.lng +
      "&sname=" + encodeURIComponent(start.name) +
      "&dlat=" + end.lat + "&dlng=" + end.lng +
      "&dname=" + encodeURIComponent(end.name);
    mids.forEach(function (s, i) {
      var n = i + 1;
      url += "&v" + n + "lat=" + s.lat + "&v" + n + "lng=" + s.lng +
        "&v" + n + "name=" + encodeURIComponent(s.name);
    });
    url += "&appname=" + NMAP_APPNAME;
    return url;
  }

  function openFullRoute(e) {
    if (e) e.preventDefault();
    var end = STOPS[STOPS.length - 1];
    var fallbackUrl = "https://map.naver.com/p/search/" + encodeURIComponent(end.name);
    var timer = setTimeout(function () {
      if (document.hidden) return;
      window.open(fallbackUrl, "_blank", "noopener");
    }, 900);
    document.addEventListener("visibilitychange", function onHide() {
      if (document.hidden) {
        clearTimeout(timer);
        document.removeEventListener("visibilitychange", onHide);
      }
    });
    window.location.href = buildFullRouteDeepLink(STOPS);
    return false;
  }

  // Reverse Geocoding: 좌표 → 실제 도로명주소 (게이트웨이 경유, Secret은 서버에만 존재)
  function fetchRoadAddressOnce(lat, lng) {
    var url = GATEWAY + "?type=reverse-geocode&coords=" + lng + "," + lat +
      "&output=json&orders=roadaddr,addr";
    return fetch(url)
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        var r = data && data.results && data.results[0];
        if (!r) return null;
        var region = r.region || {};
        var land = r.land || {};
        var area = [region.area1, region.area2, region.area3]
          .map(function (a) { return a && a.name; })
          .filter(Boolean).join(" ");
        var number = [land.number1, land.number2].filter(Boolean).join("-");
        var roadPart = [land.name, number].filter(Boolean).join(" ");
        var text = [area, roadPart].filter(Boolean).join(" ");
        return text || null;
      });
  }

  // 일시적인 네트워크 오류에 대비해 실패 시 짧은 대기 후 한 번 더 시도
  function fetchRoadAddress(lat, lng) {
    return fetchRoadAddressOnce(lat, lng).catch(function () {
      return new Promise(function (resolve) { setTimeout(resolve, 600); })
        .then(function () { return fetchRoadAddressOnce(lat, lng); })
        .catch(function () { return null; });
    });
  }

  function minutesBetween(t1, t2) {
    var a = t1.split(":").map(Number), b = t2.split(":").map(Number);
    return (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]);
  }

  // 장소 하나로 네이버 지도 앱 길찾기(자동차) 열기
  function openRouteToPlace(name, lat, lng) {
    var deepLink = "nmap://route/car?dlat=" + lat + "&dlng=" + lng +
      "&dname=" + encodeURIComponent(name) + "&appname=" + NMAP_APPNAME;
    var fallbackUrl = "https://map.naver.com/p/search/" + encodeURIComponent(name);
    var timer = setTimeout(function () {
      if (document.hidden) return;
      window.open(fallbackUrl, "_blank", "noopener");
    }, 900);
    document.addEventListener("visibilitychange", function onHide() {
      if (document.hidden) {
        clearTimeout(timer);
        document.removeEventListener("visibilitychange", onHide);
      }
    });
    window.location.href = deepLink;
  }

  var timelineHtml = "";
  STOPS.forEach(function (s, i) {
    var nameJs = JSON.stringify(s.name).replace(/"/g, "&quot;");
    timelineHtml += '<div class="stop">' +
      '<div class="num">' + (i + 1) + '</div>' +
      '<div class="stop-card">' +
        '<div class="stop-head"><h3>' + s.name + '</h3><span class="time-chip">' + s.time + '</span></div>' +
        '<p class="addr">📍 <span id="addr-' + i + '">' + s.lat.toFixed(4) + ', ' + s.lng.toFixed(4) + '</span></p>' +
        '<p class="desc">' + s.desc + '</p>' +
        (s.warn ? '<div class="note">' + s.warn + '</div>' : '') +
        '<div class="btn-row">' +
          '<a class="btn" href="#" onclick="openInNaverMap(' + nameJs + ',' + s.lat + ',' + s.lng + ');return false;">🗺️ 지도 보기</a>' +
          '<a class="btn" href="#" onclick="openRouteToPlace(' + nameJs + ',' + s.lat + ',' + s.lng + ');return false;">🚗 길찾기</a>' +
        '</div>' +
      '</div>' +
    '</div>';
    if (i < STOPS.length - 1) {
      var mins = minutesBetween(s.time, STOPS[i + 1].time);
      timelineHtml += '<div class="connector">🚗 다음 장소까지 약 ' + mins + '분 (이동 + 관람 포함)</div>';
    }
  });
  document.getElementById("timeline").innerHTML = timelineHtml;

  // 각 장소의 실제 도로명주소를 게이트웨이로 조회해서 좌표 대신 표시
  STOPS.forEach(function (s, i) {
    fetchRoadAddress(s.lat, s.lng).then(function (addr) {
      if (!addr) return;
      var el = document.getElementById("addr-" + i);
      if (el) el.textContent = addr;
    });
  });

  /* ── 네이버 지도: 전체 동선 (마커 + 경로선) ── */
  var routeMap = null, routeMarkers = [];

  function initRouteMap() {
    if (!(window.naver && naver.maps)) return;
    var el = document.getElementById("routeMap");
    if (!el) return;
    routeMap = new naver.maps.Map(el, {
      zoom: 10,
      mapTypeControl: false,
      scaleControl: false,
      logoControl: true,
      zoomControl: false,
    });
    var bounds = new naver.maps.LatLngBounds();
    var path = STOPS.map(function (s) {
      var pos = new naver.maps.LatLng(s.lat, s.lng);
      bounds.extend(pos);
      return pos;
    });
    new naver.maps.Polyline({
      map: routeMap, path: path, strokeColor: "#2F5D62",
      strokeWeight: 3, strokeOpacity: 0.85, strokeStyle: "shortdash",
    });
    routeMarkers = STOPS.map(function (s, i) {
      var marker = new naver.maps.Marker({
        position: new naver.maps.LatLng(s.lat, s.lng), map: routeMap,
        title: s.name, zIndex: 100,
        icon: { content: '<div class="nv-pin">' + (i + 1) + '</div>', anchor: new naver.maps.Point(12, 12) },
      });
      naver.maps.Event.addListener(marker, "click", function () { openInNaverMap(s.name, s.lat, s.lng); });
      return marker;
    });
    routeMap.fitBounds(bounds, { top: 24, right: 24, bottom: 24, left: 24 });
  }

  window.navermap_authFailure = function () {
    var el = document.getElementById("routeMap");
    if (el) {
      el.innerHTML = '<div class="map-fallback">네이버 지도 인증 실패<br>NCP 콘솔에서 이 사이트 도메인이 ' +
        '허용 목록(Web 서비스 URL)에 등록되어 있는지 확인해주세요.</div>';
    }
  };

  if (window.naver && naver.maps) initRouteMap();
  else window.addEventListener("load", initRouteMap);
</script>
</body>
</html>
