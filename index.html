<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>우리의 여행 모아보기</title>
<style>
  :root {
    color-scheme: light;
    --teal: #2F5D62;
    --teal-soft: #E9F1F0;
    --amber: #E8A33D;
    --amber-soft: #FDF3E3;
    --coral: #E2725B;
    --cream: #FBF7F0;
    --card: #FFFFFF;
    --ink: #2A2E2B;
    --sub: #7C8580;
    --line: #E9E4D8;
  }
  * { box-sizing: border-box; }
  html { scrollbar-width: thin; scrollbar-color: #D8D2C2 transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D8D2C2; border-radius: 999px; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 0 48px; }

  .hero {
    background: linear-gradient(135deg, var(--teal) 0%, #3E7A80 100%);
    padding: 32px 22px 26px;
    color: #fff;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 10px 24px -14px rgba(47,93,98,0.55);
  }
  .hero .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em;
    background: rgba(255,255,255,0.2);
    padding: 5px 11px; border-radius: 999px; margin-bottom: 12px;
  }
  .hero h1 { font-size: 22px; margin: 0 0 6px; line-height: 1.35; }
  .hero .sub { font-size: 13px; opacity: 0.92; line-height: 1.6; margin: 0; }

  .section-title {
    font-size: 13px; font-weight: 800; color: var(--sub);
    letter-spacing: 0.03em; margin: 26px 22px 10px; text-transform: uppercase;
  }

  .trip-list { margin: 0 22px; display: flex; flex-direction: column; gap: 12px; }
  .trip-card {
    display: block; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px 16px; position: relative;
    box-shadow: 0 6px 16px -12px rgba(42,46,43,0.25);
  }
  .trip-card .top-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .trip-card .emoji {
    width: 36px; height: 36px; border-radius: 12px; background: var(--teal-soft);
    display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0;
  }
  .trip-card h3 { font-size: 15.5px; margin: 0; line-height: 1.35; }
  .trip-card .date {
    font-size: 10.5px; font-weight: 700; color: var(--sub);
    white-space: nowrap; margin-left: auto; padding-top: 2px;
  }
  .trip-card .subtitle { font-size: 12.5px; color: var(--sub); line-height: 1.55; margin: 0 0 4px 46px; }
  .trip-card .latest-chip {
    display: inline-block; font-size: 10.5px; font-weight: 800; color: var(--amber);
    background: var(--amber-soft); padding: 3px 9px; border-radius: 999px; margin: 2px 0 0 46px;
  }
  .empty-state {
    margin: 40px 22px; text-align: center; color: var(--sub); font-size: 13px; line-height: 1.7;
  }

  footer {
    margin: 30px 22px 0; font-size: 11px; color: #A8A190; line-height: 1.7;
    border-top: 1px solid var(--line); padding-top: 14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="badge">🧳 우리의 여행 모아보기</span>
    <h1>지금까지 함께한<br/>여행들</h1>
    <p class="sub">가장 최근 여행이 맨 위에 와요. 카드를 누르면 그 여행의 상세 페이지로 이동해요.</p>
  </div>

  <div class="section-title">여행 목록</div>
  <div class="trip-list" id="tripList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">아직 등록된 여행이 없어요.</div>

  <footer>
    새 여행이 생길 때마다 이 목록에 자동으로 쌓여요. <br/>
    데이터 출처: <code>data/trips.json</code>
  </footer>

</div>

<script>
  function formatDate(dateStr) {
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var days = ["일", "월", "화", "수", "목", "금", "토"];
    return parts[0] + "." + String(parts[1]).padStart(2, "0") + "." + String(parts[2]).padStart(2, "0") +
      " (" + days[d.getDay()] + ")";
  }

  fetch("data/trips.json?t=" + Date.now())
    .then(function (res) { return res.json(); })
    .then(function (trips) {
      var listEl = document.getElementById("tripList");
      var emptyEl = document.getElementById("emptyState");

      if (!trips || !trips.length) {
        emptyEl.style.display = "block";
        return;
      }

      var sorted = trips.slice().sort(function (a, b) {
        return b.date.localeCompare(a.date);
      });

      var html = "";
      sorted.forEach(function (trip, i) {
        html += '<a class="trip-card" href="' + trip.url + '">' +
          '<div class="top-row">' +
            '<div class="emoji">' + (trip.emoji || "🗺️") + '</div>' +
            '<h3>' + trip.title + '</h3>' +
            '<div class="date">' + formatDate(trip.date) + '</div>' +
          '</div>' +
          (trip.subtitle ? '<p class="subtitle">' + trip.subtitle + '</p>' : '') +
          (i === 0 ? '<span class="latest-chip">최신 여행</span>' : '') +
        '</a>';
      });
      listEl.innerHTML = html;
    })
    .catch(function () {
      document.getElementById("emptyState").textContent = "여행 목록을 불러오지 못했어요.";
      document.getElementById("emptyState").style.display = "block";
    });
</script>
</body>
</html>
